name: Build Windows Wheels

on:
  push:
    tags: ['v*']
    branches: ['pypi-version']
  workflow_dispatch:

env:
  MSYS2_ROOT: D:\a\_temp\msys64

jobs:
  build_windows:
    name: Windows wheel (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            git

      # bmi-fortran: build in MSYS2 shell (needs MSYS2 cmake/ninja/gfortran)
      - name: Build bmi-fortran from source
        shell: msys2 {0}
        run: |
          cd /tmp
          git clone https://github.com/csdms/bmi-fortran.git
          cd bmi-fortran
          mkdir _build && cd _build
          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX=/mingw64 -DCMAKE_Fortran_COMPILER=gfortran
          ninja
          ninja install
          pkg-config --cflags --libs bmif
          echo "bmi-fortran installed OK"

      # Wheel: build in PowerShell so meson finds Python dev files via sysconfig
      # MSYS2 gfortran/pkg-config added to PATH
      - name: Build wheel
        shell: pwsh
        run: |
          # Add MSYS2 MinGW64 tools to PATH (gfortran, pkg-config, etc.)
          $env:PATH = "${{ env.MSYS2_ROOT }}\mingw64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "${{ env.MSYS2_ROOT }}\mingw64\lib\pkgconfig"

          # Verify tools are available
          gfortran --version
          pkg-config --cflags --libs bmif
          python --version

          # Install build dependencies
          python -m pip install --upgrade pip
          python -m pip install build meson-python meson ninja cython numpy wheel

          # Build wheel
          python -m build --wheel --no-isolation

          Get-ChildItem dist\

      - name: Test wheel
        shell: pwsh
        run: |
          # Need MSYS2 DLLs at runtime (libgfortran, libquadmath, etc.)
          $env:PATH = "${{ env.MSYS2_ROOT }}\mingw64\bin;$env:PATH"
          python -m pip install (Get-ChildItem dist\*.whl).FullName
          python -c "from aquacrop_bmi_babel import AquaCrop; print('OK: AquaCrop on Windows')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python }}
          path: dist/*.whl

  publish_test:
    name: Publish Windows wheels to TestPyPI
    needs: build_windows
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-windows-*
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TESTPYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish Windows wheels to PyPI
    needs: build_windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-windows-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
