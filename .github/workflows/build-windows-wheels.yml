name: Build and Test Wheels

on:
  push:
    tags: ['v*']
    branches: ['pypi-version']
  workflow_dispatch:

env:
  MSYS2_ROOT: D:\a\_temp\msys64

jobs:
  # ================================================================
  # Linux wheels (manylinux_2_28 x86_64)
  # ================================================================
  build_linux:
    name: Linux wheel (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y gcc-gfortran cmake pkgconfig git

      - name: Set up Python ${{ matrix.python }}
        run: |
          PY_TAG=$(echo "${{ matrix.python }}" | tr -d '.')
          PY_BIN=/opt/python/cp${PY_TAG}-cp${PY_TAG}/bin
          echo "${PY_BIN}" >> $GITHUB_PATH
          ${PY_BIN}/python --version

      - name: Build bmi-fortran from source
        run: |
          cd /tmp
          git clone https://github.com/csdms/bmi-fortran.git
          cd bmi-fortran
          mkdir _build && cd _build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_Fortran_COMPILER=gfortran
          make -j$(nproc)
          make install
          ldconfig
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig pkg-config --cflags --libs bmif
          echo "bmi-fortran installed OK"

      - name: Build wheel
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib64
        run: |
          python -m pip install --upgrade pip
          python -m pip install build meson-python meson ninja cython numpy wheel auditwheel patchelf
          python -m build --wheel --no-isolation
          echo "=== Built wheel ==="
          ls -la dist/

      - name: Repair wheel (bundle .so, tag manylinux)
        env:
          LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib64
        run: |
          auditwheel show dist/*.whl
          auditwheel repair dist/*.whl --wheel-dir dist-fixed/
          rm -f dist/*.whl
          cp dist-fixed/*.whl dist/
          echo "=== Repaired wheel ==="
          ls -la dist/

      - name: Test wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip install setuptools
          python -m pip install pymt
          cd /tmp
          python -c "from aquacrop_bmi_babel import AquaCrop; print('OK: direct import')"
          python -c "from pymt.models import AquaCrop; print('OK: pymt plugin')"

  # ================================================================
  # Windows wheels (MSYS2 / MinGW64)
  # ================================================================
  build_windows:
    name: Windows wheel (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            git

      - name: Build bmi-fortran from source
        shell: msys2 {0}
        run: |
          cd /tmp
          git clone https://github.com/csdms/bmi-fortran.git
          cd bmi-fortran
          mkdir _build && cd _build
          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX=/mingw64 -DCMAKE_Fortran_COMPILER=gfortran
          ninja
          ninja install
          pkg-config --cflags --libs bmif
          echo "bmi-fortran installed OK"

      - name: Patch meson.build for Windows
        shell: pwsh
        run: |
          # Ensure 'c' language is in the project() call for Cython-generated C code
          $content = Get-Content meson.build -Raw
          if ($content -notmatch "'c',\s*'fortran',") {
            $content = $content -replace "'fortran',\s*'cython',", "'c', 'fortran', 'cython',"
            Set-Content meson.build $content
            Write-Host "Patched: added 'c' language to meson.build"
          } else {
            Write-Host "Already has 'c' language - no patch needed"
          }

          Write-Host "=== Patched meson.build (first 10 lines) ==="
          Get-Content meson.build -Head 10

      - name: Build wheel
        shell: pwsh
        env:
          CC: gcc
          FC: gfortran
          PKG_CONFIG_PATH: D:\a\_temp\msys64\mingw64\lib\pkgconfig
        run: |
          $env:PATH = "${{ env.MSYS2_ROOT }}\mingw64\bin;$env:PATH"

          python -m pip install --upgrade pip
          python -m pip install build meson-python meson ninja cython numpy wheel delvewheel

          python -m build --wheel --no-isolation

          # Extract wheel to find libaquacropbmi.dll
          $whl = (Get-ChildItem dist\*.whl).FullName
          Expand-Archive $whl -DestinationPath wheel-tmp\
          $dlldir = (Get-ChildItem -Recurse wheel-tmp\ -Filter "libaquacropbmi.dll" | Select-Object -First 1).DirectoryName
          Write-Host "Found DLL in: $dlldir"

          # Bundle all runtime DLLs into wheel
          delvewheel repair $whl --wheel-dir dist-fixed\ --add-path "${{ env.MSYS2_ROOT }}\mingw64\bin;$dlldir"

          Remove-Item dist\*.whl
          Copy-Item dist-fixed\*.whl dist\

          Write-Host "=== Built wheel ==="
          Get-ChildItem dist\

      - name: Test wheel
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem dist\*.whl).FullName
          python -m pip install setuptools
          python -m pip install pymt
          cd $env:TEMP
          python -c "from aquacrop_bmi_babel import AquaCrop; print('OK: direct import')"
          python -c "from pymt.models import AquaCrop; print('OK: pymt plugin')"

 
