name: Build Wheels

on:
  push:
    branches: ['pypi-version']
  workflow_dispatch:

env:
  MSYS2_ROOT: D:\a\_temp\msys64

jobs:
  # ─── Linux wheels ───
  build_linux:
    name: Linux wheel (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build pkg-config

      - name: Build bmi-fortran from source
        run: |
          cd /tmp
          git clone https://github.com/csdms/bmi-fortran.git
          cd bmi-fortran
          mkdir _build && cd _build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_Fortran_COMPILER=gfortran
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          pkg-config --cflags --libs bmif

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build meson-python meson ninja cython numpy wheel
          python -m build --wheel --no-isolation

      - name: Repair wheel with auditwheel
        run: |
          python -m pip install auditwheel patchelf
          auditwheel repair dist/*.whl --wheel-dir dist-fixed/
          rm dist/*.whl
          mv dist-fixed/*.whl dist/
          ls -la dist/

      - name: Test wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "from aquacrop_bmi_babel import AquaCrop; print('OK: AquaCrop on Linux')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-py${{ matrix.python }}
          path: dist/*.whl

  # ─── Source distribution ───
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build pkg-config

      - name: Build bmi-fortran from source
        run: |
          cd /tmp
          git clone https://github.com/csdms/bmi-fortran.git
          cd bmi-fortran
          mkdir _build && cd _build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_Fortran_COMPILER=gfortran
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build meson-python meson ninja cython numpy
          python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ─── Windows wheels ───
  build_windows:
    name: Windows wheel (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            git

      - name: Build bmi-fortran from source
        shell: msys2 {0}
        run: |
          cd /tmp
          git clone https://github.com/csdms/bmi-fortran.git
          cd bmi-fortran
          mkdir _build && cd _build
          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX=/mingw64 -DCMAKE_Fortran_COMPILER=gfortran
          ninja
          ninja install
          pkg-config --cflags --libs bmif

      - name: Patch meson.build for Windows
        shell: pwsh
        run: |
          $content = Get-Content meson.build -Raw
          $content = $content -replace "'fortran',\s*'cython',", "'c', 'fortran', 'cython',"
          Set-Content meson.build $content

      - name: Build wheel
        shell: pwsh
        env:
          CC: gcc
          FC: gfortran
          PKG_CONFIG_PATH: D:\a\_temp\msys64\mingw64\lib\pkgconfig
        run: |
          $env:PATH = "${{ env.MSYS2_ROOT }}\mingw64\bin;$env:PATH"

          python -m pip install --upgrade pip
          python -m pip install build meson-python meson ninja cython numpy wheel delvewheel

          python -m build --wheel --no-isolation

          $whl = (Get-ChildItem dist\*.whl).FullName
          Expand-Archive $whl -DestinationPath wheel-tmp\
          $dlldir = (Get-ChildItem -Recurse wheel-tmp\ -Filter "libaquacropbmi.dll" | Select-Object -First 1).DirectoryName
          Write-Host "Found DLL in: $dlldir"

          delvewheel repair $whl --wheel-dir dist-fixed\ --add-path "${{ env.MSYS2_ROOT }}\mingw64\bin;$dlldir"

          Remove-Item dist\*.whl
          Copy-Item dist-fixed\*.whl dist\
          Get-ChildItem dist\

      - name: Test wheel
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem dist\*.whl).FullName
          cd $env:TEMP
          python -c "from aquacrop_bmi_babel import AquaCrop; print('OK: AquaCrop on Windows')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python }}
          path: dist/*.whl
