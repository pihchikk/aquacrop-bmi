[build-system]
build-backend = "mesonpy"
requires = ["cython", "numpy", "meson-python", "meson", "ninja", "wheel"]

[project]
name = "aquacrop_bmi_babel"
readme = "README.rst"
authors = [
  {name = "pihchikk", email = "alperf97@gmail.com"},
]
maintainers = [
  {name = "pihchikk", email = "alperf97@gmail.com"},
]
description = "BMI wrapper for AquaCrop with full Basic Model Interface compliance and WSL support"
license = {text = "MIT License"}
classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.10"
keywords=["bmi", "pymt", "aquacrop", "crop modeling", "water productivity", "irrigation"]
dynamic = ["version"]
dependencies = [
  "numpy",
  "bmipy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "pyyaml>=5.0",
  "scipy>=1.9",
  "salib>=1.4",
  "agro-met-equations-dynalogic>=2.0",
  "soiltexture>=1.0",
  "pyarrow>=20.0",
]

[project.urls]
homepage = "https://github.com/pihchikk/aquacrop_bmi_babel"
repository = "https://github.com/pihchikk/aquacrop_bmi_babel"
documentation = "https://github.com/pihchikk/aquacrop_bmi_babel"
changelog = "https://github.com/pihchikk/aquacrop_bmi_babel/blob/main/CHANGES.rst"

[project.entry-points."pymt.plugins"]
AquaCrop = "aquacrop_bmi_babel.bmi:AquaCrop"

[project.scripts]
aquacrop-runner = "aquacrop_bmi_babel.aquacrop_runner:main"
aquacrop-calibrate-bmi = "aquacrop_bmi_babel.calibrate_bmi:main"

[project.optional-dependencies]
dev = [
  "meson",
  "meson-python",
  "ninja",
  "nox",
  "build",
  "twine",
]
docs = [
  "sphinx>=4",
  "sphinx-copybutton",
  "sphinx-inline-tabs",
  "sphinxcontrib.towncrier",
  "pygments>=2.4",
  "furo",
]
testing = [
  "pytest>=6.0",
  "pytest-cov",
  "bmi-tester>=0.5.4",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
norecursedirs = [".*", "*.egg*", "build", "dist", "aquacrop_bmi_babel"]
addopts = """
    --ignore setup.py
    --tb native
    --strict-markers
    --durations 16
    -vvv
"""
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE"
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
line_length = 88

[tool.check-manifest]
ignore = [
  "aquacrop_bmi_babel/data",
  "aquacrop_bmi_babel/data/**/*",
]

[tool.towncrier]
directory = "news"
package = "aquacrop_bmi_babel"
filename = "CHANGES.rst"
single_file = true
underlines = "-^\""
issue_format = "`#{issue} <https://github.com/pihchikk/aquacrop_bmi_babel/issues/{issue}>`_"
title_format = "{version} ({project_date})"
wrap = true

[tool.zest-releaser]
tag-format = "v{version}"
python-file-with-version = "aquacrop_bmi_babel/_version.py"