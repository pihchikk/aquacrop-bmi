# Model configuration parameters for AquaCrop BMI
# Format compatible with model_metadata library

latitude:
  description: Latitude of simulation point
  value:
    type: float
    default: 51.167754
    range: [-90.0, 90.0]
    units: degrees_north

longitude:
  description: Longitude of simulation point
  value:
    type: float
    default: 40.757038
    range: [-180.0, 180.0]
    units: degrees_east

simulation_start:
  description: Start date of simulation period (YYYY-MM-DD)
  value:
    type: string
    default: "2016-04-01"
    units: "-"

simulation_end:
  description: End date of simulation period (YYYY-MM-DD)
  value:
    type: string
    default: "2016-09-15"
    units: "-"

growing_season_start:
  description: Start date of growing season (YYYY-MM-DD)
  value:
    type: string
    default: "2016-04-01"
    units: "-"

growing_season_end:
  description: End date of growing season (YYYY-MM-DD)
  value:
    type: string
    default: "2016-09-15"
    units: "-"

gwt_depth:
  description: Groundwater table depth below surface
  value:
    type: float
    default: 10.0
    range: [0.0, 1000.0]
    units: m

gwt_ec:
  description: Groundwater electrical conductivity
  value:
    type: float
    default: 0.0
    range: [0.0, 50.0]
    units: dS/m

fertility_stress:
  description: Soil fertility stress level (0-100%)
  value:
    type: int
    default: 50
    range: [0, 100]
    units: percent

crop_type:
  description: Crop type selection
  value:
    type: string
    default: "Wheat"
    choices: ["Wheat", "Maize", "Potato", "Tomato", "Barley", "Oat", "Canola", "Soybean", "SugarBeet", "Sunflower"]
    units: "-"

# Soil layer parameters (per layer)
soil_layers:
  description: Number of soil layers
  value:
    type: int
    default: 5
    range: [1, 12]
    units: "-"

soil_thickness:
  description: Thickness of each soil layer
  value:
    type: float
    default: 0.2
    range: [0.01, 5.0]
    units: m

soil_sat:
  description: Soil water content at saturation (volumetric)
  value:
    type: float
    default: 48.0
    range: [30.0, 70.0]
    units: percent

soil_fc:
  description: Soil water content at field capacity (volumetric)
  value:
    type: float
    default: 45.0
    range: [10.0, 60.0]
    units: percent

soil_wp:
  description: Soil water content at wilting point (volumetric)
  value:
    type: float
    default: 14.0
    range: [1.0, 40.0]
    units: percent

soil_ksat:
  description: Saturated hydraulic conductivity
  value:
    type: float
    default: 602.0
    range: [1.0, 5000.0]
    units: mm/d

soil_clay:
  description: Clay content (for Rosetta pedotransfer)
  value:
    type: float
    default: 25.0
    range: [0.0, 100.0]
    units: percent

soil_silt:
  description: Silt content (for Rosetta pedotransfer)
  value:
    type: float
    default: 40.0
    range: [0.0, 100.0]
    units: percent

soil_sand:
  description: Sand content (for Rosetta pedotransfer)
  value:
    type: float
    default: 35.0
    range: [0.0, 100.0]
    units: percent

soil_wc:
  description: Initial soil water content (volumetric)
  value:
    type: float
    default: 38.0
    range: [0.0, 70.0]
    units: percent

soil_ec:
  description: Electrical conductivity of soil saturation extract
  value:
    type: float
    default: 0.2
    range: [0.0, 50.0]
    units: dS/m

# Weather data source
weather_source:
  description: Source of weather data
  value:
    type: string
    default: "nasa_power"
    choices: ["nasa_power", "file"]
    units: "-"

weather_file:
  description: Path to weather data file (if weather_source=file)
  value:
    type: string
    default: ""
    units: "-"

# Preprocessing options
preprocessing_enabled:
  description: Enable automatic preprocessing of config to project files
  value:
    type: boolean
    default: true
    units: "-"

soil_method:
  description: Method for soil parameter determination
  value:
    type: string
    default: "rosetta"
    choices: ["rosetta", "direct", "texture"]
    units: "-"

cache_weather:
  description: Cache weather data for reuse
  value:
    type: boolean
    default: true
    units: "-"

# Output configuration
output_directory:
  description: Directory for output files
  value:
    type: string
    default: "./output"
    units: "-"

save_daily:
  description: Save daily time series output
  value:
    type: boolean
    default: true
    units: "-"

save_final:
  description: Save final state output
  value:
    type: boolean
    default: true
    units: "-"

output_format:
  description: Output file format
  value:
    type: string
    default: "csv"
    choices: ["csv", "json", "netcdf"]
    units: "-"

# Calibration parameters (optional)
calibration_enabled:
  description: Enable calibration mode
  value:
    type: boolean
    default: false
    units: "-"

calibration_target:
  description: Target variable for calibration
  value:
    type: string
    default: "yield"
    choices: ["yield", "biomass", "canopy_cover", "soil_moisture"]
    units: "-"

observed_yield:
  description: Observed yield for calibration
  value:
    type: float
    default: 0.0
    range: [0.0, 50.0]
    units: t/ha

sampling_range:
  description: Sampling range for parameter perturbation
  value:
    type: float
    default: 10.0
    range: [1.0, 100.0]
    units: percent

# Advanced crop parameters
base_temperature:
  description: Base temperature for crop development
  value:
    type: float
    default: 1.0
    range: [0.0, 20.0]
    units: degC

upper_temperature:
  description: Upper temperature for crop development
  value:
    type: float
    default: 39.0
    range: [20.0, 50.0]
    units: degC

plants_per_hectare:
  description: Plant density
  value:
    type: int
    default: 4000000
    range: [10000, 10000000]
    units: plants/ha

max_canopy_cover:
  description: Maximum canopy cover (CCx)
  value:
    type: float
    default: 0.93
    range: [0.1, 1.0]
    units: fraction

canopy_growth_coefficient:
  description: Canopy growth coefficient (CGC)
  value:
    type: float
    default: 0.11730
    range: [0.001, 0.5]
    units: 1/d

canopy_decline_coefficient:
  description: Canopy decline coefficient (CDC)
  value:
    type: float
    default: 0.09513
    range: [0.001, 0.5]
    units: 1/d

reference_harvest_index:
  description: Reference Harvest Index (HIo)
  value:
    type: float
    default: 59.0
    range: [10.0, 90.0]
    units: percent

water_productivity:
  description: Water Productivity normalized for ETo and CO2 (WP*)
  value:
    type: float
    default: 18.11
    range: [5.0, 40.0]
    units: g/m2

max_rooting_depth:
  description: Maximum effective rooting depth
  value:
    type: float
    default: 1.71
    range: [0.1, 5.0]
    units: m

min_rooting_depth:
  description: Minimum effective rooting depth
  value:
    type: float
    default: 0.11
    range: [0.01, 1.0]
    units: m

days_emergence:
  description: Days from sowing to emergence
  value:
    type: int
    default: 14
    range: [1, 60]
    units: d

days_maturity:
  description: Days from sowing to maturity
  value:
    type: int
    default: 137
    range: [50, 500]
    units: d

days_flowering:
  description: Days from sowing to flowering
  value:
    type: int
    default: 76
    range: [20, 300]
    units: d

flowering_length:
  description: Length of flowering stage
  value:
    type: int
    default: 11
    range: [1, 50]
    units: d

# Irrigation parameters
irrigation_method:
  description: Irrigation method
  value:
    type: int
    default: 0
    range: [0, 3]
    units: "-"
    choices_description: "0=rainfed, 1=sprinkler, 2=drip, 3=surface"

irrigation_depth:
  description: Irrigation water depth applied
  value:
    type: float
    default: 0.0
    range: [0.0, 100.0]
    units: mm

irrigation_efficiency:
  description: Irrigation application efficiency
  value:
    type: float
    default: 100.0
    range: [50.0, 100.0]
    units: percent

# Management practices
mulch_coverage:
  description: Percentage of soil surface covered by mulches
  value:
    type: float
    default: 0.0
    range: [0.0, 100.0]
    units: percent

soil_bunds_effect:
  description: Effect of soil bunds on surface water storage
  value:
    type: float
    default: 0.0
    range: [0.0, 50.0]
    units: mm

weed_coverage:
  description: Weed coverage percentage
  value:
    type: float
    default: 0.0
    range: [0.0, 100.0]
    units: percent

co2_concentration:
  description: Atmospheric CO2 concentration
  value:
    type: float
    default: 369.41
    range: [300.0, 800.0]
    units: ppm

# Stress thresholds
p_exp_upper:
  description: Water depletion threshold for canopy expansion (upper)
  value:
    type: float
    default: 0.46
    range: [0.0, 1.0]
    units: fraction

p_sto:
  description: Water depletion threshold for stomatal closure
  value:
    type: float
    default: 0.41
    range: [0.0, 1.0]
    units: fraction

p_sen:
  description: Water depletion threshold for senescence
  value:
    type: float
    default: 0.77
    range: [0.0, 1.0]
    units: fraction

ec_start_stress:
  description: EC at which crop starts to be affected by salinity
  value:
    type: float
    default: 3.0
    range: [0.0, 30.0]
    units: dS/m

ec_no_growth:
  description: EC at which crop can no longer grow
  value:
    type: float
    default: 26.0
    range: [0.0, 50.0]
    units: dS/m